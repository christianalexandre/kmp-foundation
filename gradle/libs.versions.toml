# Baseado no catálogo do imou-smart-home para o clone futuro não divergir de
# versões (lá há pins sensíveis a ABI do Kotlin — ver o comentário do Coil).
[versions]
kotlin = "2.3.21"
composeMultiplatform = "1.11.1"
# As libs do CMP versionam separadamente do plugin desde a 1.9 (por isso os
# accessors `compose.*` do plugin foram deprecados): material3 segue trilha
# própria — é a versão que o plugin CMP 1.11.1 resolve, não 1.11.x.
composeRuntime = "1.11.1"
composeFoundation = "1.11.1"
composeMaterial3 = "1.9.0"
agp = "9.3.1"
# SDK levels no catálogo (e não no convention plugin) porque com o AGP 9 a
# config Android do módulo KMP vive no bloco `androidLibrary {}` do Kotlin, que
# cada módulo declara — o catálogo é o que mantém o valor único.
androidCompileSdk = "36"
androidMinSdk = "24"
androidTargetSdk = "36"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.10.0"
# ViewModel multiplataforma da JetBrains (pacote androidx.lifecycle em commonMain).
jbLifecycle = "2.10.0"
kover = "0.9.9"
# Detekt 2 (groupId novo: dev.detekt). Ainda alpha, adotado de propósito: é a
# linha construída contra Kotlin 2.3 / Gradle 9 / AGP 9 — exatamente esta stack.
# A 1.23.8 é "estável" mas testada só até Kotlin 2.0.21 / Gradle 8.12.1.
detekt = "2.0.0-alpha.6"
androidx-activityCompose = "1.10.1"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeRuntime" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeFoundation" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jbLifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jbLifecycle" }
# Traz o collectAsStateWithLifecycle para commonMain (a coleta pausa em background).
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jbLifecycle" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
# No Detekt 2 o ruleset de formatação (ktlint) chama-se ktlint-wrapper.
detekt-formatting = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }

# Consumidas pelo build-logic (convention plugins) como implementation.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# AGP 9: módulo KMP com alvo Android usa este plugin (+ bloco androidLibrary),
# não mais com.android.library/application + androidTarget().
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

# Convention plugins (build-logic/): aplicar por id nos módulos —
# id("kmpfoundation.kmp.module") e id("kmpfoundation.quality").
