pre-commit:
  commands:
    detekt:
      glob: "*.{kt,kts}"
      # A task varre os source sets inteiros (não aceita lista de arquivos),
      # mas é rápida com o cache do Gradle.
      run: ./gradlew detekt

commit-msg:
  commands:
    message:
      run: ./scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    tests:
      # Só os testes JVM (~2s). Teste quebrado nunca é trabalho-em-andamento
      # legítimo, então vale barrar; já o gate de cobertura NÃO entra aqui de
      # propósito: ele impediria o push de uma branch de WIP (backup, PR em
      # draft, spike), e o lugar dele é bloquear o merge, não o push.
      # Cobertura, testes iOS e lint são gate de PR — ver docs/tech-debt.md.
      run: ./gradlew :composeApp:testAndroidHostTest
