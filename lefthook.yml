pre-commit:
  commands:
    detekt:
      glob: "*.{kt,kts}"
      # A task varre os source sets inteiros (não aceita lista de arquivos),
      # mas é rápida com o cache do Gradle. `detektBuildLogic` alcança os
      # convention plugins, que estão numa included build.
      run: ./gradlew detekt detektBuildLogic
    swiftlint:
      glob: "*.swift"
      # Aqui dá para passar só os arquivos staged — é instantâneo.
      run: swiftlint lint --strict --quiet {staged_files}

commit-msg:
  commands:
    message:
      run: ./scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    tests:
      # Testes das DUAS plataformas (~6s): o mesmo commonTest pode passar na JVM
      # e falhar no iOS (expect/actual, coroutines, ordenação de coleções), que
      # é justamente o risco de um projeto KMP. Os 5s a mais que rodar só a JVM
      # pagam esse seguro.
      #
      # O gate de COBERTURA continua fora daqui de propósito: ele impediria o
      # push de uma branch de WIP (backup, PR em draft, spike). Teste quebrado
      # nunca é WIP legítimo; cobertura baixa é. Cobertura e lint completo são
      # gate de PR — ver docs/tech-debt.md.
      run: ./gradlew allTests
